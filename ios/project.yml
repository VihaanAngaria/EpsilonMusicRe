name: EpsilonMusicRe
options:
  bundleIdPrefix: app.epsilonmusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  EpsilonMusicRe:
    type: application
    platform: iOS
    sources:
      - path: EpsilonMusicRe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.epsilonmusic.epsreios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Epsilon Music
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppleMusicUsageDescription: "Epsilon Music reads your device music library to browse and play your songs."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  EpsilonMusicRe:
    build:
      targets:
        EpsilonMusicRe: all
    run:
      config: Debug
    archive:
      config: Release
