name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Prepare Signing Keystore (verify release secrets, CI-key fallback)
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -e
        KS="keystore.jks"
        SIGN_MODE="release"
        REASON=""

        if [ -z "$ENCODED_KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          SIGN_MODE="ci"
          REASON="one or more signing secrets are not set (need KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
        else
          echo "$ENCODED_KEYSTORE" | base64 -di > "$KS"
          echo "Keystore decoded: $(stat -c%s "$KS") bytes."

          # Layered verification:
          #   1. keytool -list  -> STORE_PASSWORD must open the keystore
          #   2. keytool -alias -> KEY_ALIAS must exist
          #   3. jarsigner trial-sign (when available) -> KEY_PASSWORD can
          #      actually decrypt the key
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            SIGN_MODE="ci"
            REASON="STORE_PASSWORD does not match the decoded keystore"
          elif ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            SIGN_MODE="ci"
            REASON="KEY_ALIAS not found in the keystore"
          elif command -v jarsigner > /dev/null 2>&1 && command -v jar > /dev/null 2>&1; then
            echo ci > /tmp/epsilon-t.txt
            (cd /tmp && jar cf epsilon-t.jar epsilon-t.txt) || true
            if jarsigner -keystore "$KS" -storepass "$STORE_PASSWORD" \
                 -keypass "$KEY_PASSWORD" /tmp/epsilon-t.jar "$KEY_ALIAS" \
                 > /dev/null 2>&1; then
              echo "Release keystore verified: store password, alias and key password are all valid."
            else
              SIGN_MODE="ci"
              REASON="KEY_PASSWORD cannot decrypt the key (trial signing failed)"
            fi
            rm -f /tmp/epsilon-t.jar /tmp/epsilon-t.txt
          else
            echo "Release keystore verified: store password and alias are valid."
          fi
        fi

        if [ "$SIGN_MODE" = "ci" ]; then
          echo "::warning::Release signing unavailable ($REASON). Falling back to an ephemeral CI signing key - the APK stays installable but is NOT release-signed. To enable release signing, copy the EXACT values of KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD from the original EpsilonMusic repo (Settings > Secrets and variables > Actions)."
          rm -f "$KS"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
            -storepass epsilonci -keypass epsilonci -alias epsilonci \
            -dname "CN=EpsilonMusicRe CI, OU=CI, O=EpsilonMusicRe, C=IN" \
            -keyalg RSA -keysize 4096 -validity 10950 > /dev/null 2>&1
          echo "STORE_PASS=epsilonci" >> "$GITHUB_ENV"
          echo "KEY_PASS=epsilonci" >> "$GITHUB_ENV"
          echo "ALIAS=epsilonci" >> "$GITHUB_ENV"
        else
          echo "STORE_PASS=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
        fi
        echo "SIGN_MODE=$SIGN_MODE" >> "$GITHUB_ENV"

        {
          echo "### Signing mode: \`${SIGN_MODE}\`"
          if [ "$SIGN_MODE" = "ci" ]; then
            echo "WARNING: APK is signed with an ephemeral **CI key** (installable, but not release-signed)."
            echo "Reason: ${REASON}."
            echo "Fix the repo secrets \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\` to enable release signing."
          else
            echo "OK: APK is **release-signed** with the repository keystore."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease \
          -Pandroid.injected.signing.store.file="$(pwd)/keystore.jks" \
          -Pandroid.injected.signing.store.password="$STORE_PASS" \
          -Pandroid.injected.signing.key.alias="$ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASS" \
          --no-daemon \
          --stacktrace

    - name: Verify APK was produced
      id: verify_apk
      run: |
        echo "=== Searching for built APK files ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
        APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No APK was produced. The build failed to generate an output artifact."
          exit 1
        fi
        echo "=== APK count: $APK_COUNT ==="
        for apk in $(find app/build/outputs/apk -name "*.apk" -type f); do
          echo "APK: $apk"
          ls -lh "$apk"
        done
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

    - name: Upload Universal Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Epsilon-MusicRe-Universal-${{ env.SIGN_MODE == 'release' && 'Release-Signed' || 'CI-Signed' }}-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f keystore.jks /tmp/epsilon-t.jar /tmp/epsilon-t.txt
        echo "Keystore cleaned up."
